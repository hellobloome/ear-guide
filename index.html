<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloomé Ear Guide</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:20px;background:#faf8f7;color:#4a2222}
.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input{width:100%;padding:12px;font-size:16px}
button{display:block;width:100%;margin:10px 0;padding:14px;border:none;border-radius:8px;background:#5A1611;color:white;font-size:16px}
.hidden{display:none}
a{color:#5A1611}
</style></head>
<body>
<h1>🌿 Bloomé Ear Guide</h1>
<p>Search by problem.</p>
<input id="search" placeholder="e.g. stress, insomnia, headache">
<div id="results"></div>

<script>
const data=[
{name:"Stress",points:["Shen Men","Heart","Subcortex"],desc:"Support relaxation and emotional balance."},
{name:"Insomnia",points:["Shen Men","Heart","Kidney","Occiput"],desc:"Commonly used to support sleep."},
{name:"Headache",points:["Shen Men","Temple","Occiput"],desc:"Commonly used for headache support."},
{name:"Digestion",points:["Stomach","Spleen","Large Intestine"],desc:"Commonly used to support digestion."}
];
const out=document.getElementById("results");
function render(list){
 out.innerHTML="";
 list.forEach(i=>{
  out.innerHTML+=`<div class="card"><h3>${i.name}</h3>
  <p>${i.desc}</p>
  <strong>Recommended points</strong><ul>${i.points.map(p=>`<li>${p}</li>`).join("")}</ul>
  <p>Press each ear seed for 20-30 seconds, 2-3 times daily.</p></div>`;
 });
 if(!list.length) out.innerHTML="<div class='card'>No results found.</div>";
}
render(data);
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();
 render(data.filter(x=>x.name.toLowerCase().includes(q)||x.points.join(" ").toLowerCase().includes(q)));
});
</script>
</body></html>
